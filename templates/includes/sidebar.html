<aside class="sidebar" aria-label="功能导航">
  <div class="sidebar-heading"><span>工作台</span><span class="sidebar-dot" aria-hidden="true"></span></div>
  <nav class="sidebar-nav">
    <a class="nav-item{% if request.resolver_match.url_name == 'home' %} is-active{% endif %}" href="{% url 'core:home' %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1v-8.5Z"/></svg><span>首页</span>
    </a>

    {% if user.role == "student" or user.role == "teacher" %}
      <p class="nav-group-label">报修服务</p>
      <a class="nav-item" href="/tickets/create/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>提交报修</span></a>
      <a class="nav-item" href="/tickets/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm2 5h8M8 13h8M8 17h5"/></svg><span>我的工单</span></a>
    {% elif user.role == "maintenance" %}
      <p class="nav-group-label">维修工作</p>
      <a class="nav-item" href="/tickets/tasks/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6.5 3-3 3 3-3 3M13 8l-9 9v3h3l9-9M13 18h7"/></svg><span>我的任务</span></a>
    {% elif user.role == "admin" %}
      <p class="nav-group-label">事务管理</p>
      <a class="nav-item" href="/admin-dashboard/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9Zm10 7h6v-9h-6v9ZM4 20h6v-3H4v3Zm10-13h6V4h-6v3Z"/></svg><span>工作概览</span></a>
      <a class="nav-item" href="/tickets/manage/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm2 5h8M8 13h8M8 17h5"/></svg><span>工单管理</span></a>
      <a class="nav-item" href="/tickets/cancellations/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 1-6.4 2.7M4 3v5h5M12 7v5l3 2"/></svg><span>取消申请</span></a>
      <a class="nav-item" href="/accounts/reviews/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm7-1 2 2 4-5"/></svg><span>用户审核</span></a>
      <a class="nav-item" href="/locations/manage/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-5.2 7-12a7 7 0 1 0-14 0c0 6.8 7 12 7 12Zm0-9a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg><span>基础资料管理</span></a>
    {% endif %}

    <p class="nav-group-label">账号</p>
    <a class="nav-item" href="/accounts/profile/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm8 9a8 8 0 0 0-16 0"/></svg><span>个人信息</span></a>
  </nav>
  <div class="sidebar-footer"><span class="status-indicator" aria-hidden="true"></span><span>服务系统运行正常</span></div>
</aside>
