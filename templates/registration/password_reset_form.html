{% extends "registration/base.html" %}
{% block title %}找回密码 | 校园智办{% endblock %}
{% block auth_content %}
  <header class="auth-form-heading">
    <p class="eyebrow">账号恢复</p><h2>找回密码</h2>
    <p>填写账号及已绑定的找回邮箱，申请密码重置链接。</p>
  </header>
  <form class="login-form" method="post">
    {% csrf_token %}
    {% include "registration/recovery_fields.html" %}
    <button class="button button-primary button-wide" type="submit">申请重置链接</button>
  </form>
  <p class="auth-help">未绑定邮箱或无法访问邮箱？请联系维护者核验身份后处理。</p>
  <p class="auth-switch"><a href="{% url 'accounts:login' %}">返回登录</a></p>
{% endblock %}
