{% if form.non_field_errors %}<div class="form-alert" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
  <div class="field-group">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    <div class="field-control">{{ field }}</div>
    {% if field.help_text %}<div class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
    {% if field.errors %}<div class="field-error" role="alert">{{ field.errors }}</div>{% endif %}
  </div>
{% endfor %}
